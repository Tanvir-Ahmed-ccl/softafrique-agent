# Softafrique Backup Agent — example configuration.
#
# On an installed device this file lives at:
#   C:\ProgramData\SoftafriqueBackupAgent\config.yaml
#
# There are no credentials in this file and there must never be any. The
# repository key and the device password are returned by the gateway at
# enrollment and sealed with DPAPI in C:\ProgramData\SoftafriqueBackupAgent\
# credentials.dat, which only SYSTEM and Administrators can read. The device id
# comes from the gateway too, not from this file and not from the machine name.

# Gateway API. The agent enrolls here, fetches its remote configuration and
# reports each backup's outcome.
server: "https://backup.softafrique.net/api/v1"

# Restic repository URL. This is only consulted on a device that has NOT been
# enrolled: for local development and for `agent reimport` after a reimage. An
# enrolled device uses the repository the gateway returned, so a stale value
# here cannot point a paying customer at the wrong place.
#
# The server serves repositories at the root, one per device:
#   rest:https://backup.softafrique.net/{device_id}
#
# {device_id} is replaced with device_id below, which on an enrolled device is
# the enrollment-assigned id. Never put a password in this URL.
repo: "rest:https://backup.softafrique.net/{device_id}"

# The device id. Also only used when unenrolled; after enrollment the gateway's
# id always wins, because that is the value snapshots are attributed to.
# device_id: "dev-01HQ8"

# restic --password-file. Also unenrolled-devices-only: an enrolled device
# passes the key to restic through the child process environment instead, so the
# secret never reaches a command line or a file on disk. If you set this, keep
# the file under the data directory: on upgrade the agent deletes it, because
# keeping a plaintext copy of a key that is already sealed is a liability.
# password_file: "C:\\ProgramData\\SoftafriqueBackupAgent\\repo.password"

# Path to restic.exe. Leave as "restic" to use the copy bundled beside the
# agent, which is what the MSI installs.
restic_path: "restic"

# Folders to protect. Leave this empty to take the folder the gateway reports in
# /config (and in the /enroll reply) — the usual case, and the reason a
# deployment can be changed from the dashboard. Set it only to override the
# gateway, e.g. when support has been asked to protect a second folder.
#
# include:
#   - "C:\\CustomerData"
include: []

# Optional paths or globs to skip (restic's own syntax).
exclude: []

# How often a backup runs. restic is incremental, so this is a full check of
# everything plus a new snapshot of what changed. The gateway's
# schedule_interval overrides this on an enrolled device.
schedule_interval: 1h

# Delay before retrying a failed run. Retries continue with equal jitter until
# a run succeeds, capped at five times this interval, unless max_retries says
# otherwise. A device that was switched off needs this to be short.
retry_interval: 5m

# Retries per scheduled run. -1 (the default) means keep retrying until one
# succeeds, which is what you want on a machine that is often off. Set 0 to
# try once and wait for the next slot.
max_retries: -1

# Random delay of up to this much before a run. It applies to the startup wait
# and to each retry, so a fleet that was off during a gateway outage does not
# come back and hit the server in the same instant.
jitter: 30s

# How often the remote configuration is refreshed while the agent is idle.
# 0 derives it from schedule_interval.
config_poll_interval: 5m

# How often an idle agent reports in, so a healthy-but-quiet device still shows
# as online in the dashboard.
status_heartbeat: 15m

# Agent state: the sealed credentials, status.json, the log and restic's cache.
# The MSI creates this directory and restricts it to SYSTEM and Administrators.
# That ACL is the real protection for the sealed key, so do not point this
# somewhere else on a customer machine: the agent logs a warning if you do.
data_dir: "C:\\ProgramData\\SoftafriqueBackupAgent"

# Machine-readable state for Tactical RMM and dashboards. Contains no secrets:
# the repository appears as a host name only.
status_file: "C:\\ProgramData\\SoftafriqueBackupAgent\\status.json"

# Log destination. Every timestamp is UTC, so agent records line up with gateway
# records across a DST change.
log_file: "C:\\ProgramData\\SoftafriqueBackupAgent\\agent.log"

# Periodic `restic stats` readings for the monitoring file. Off costs nothing
# but the usage numbers in status.json.
stats_enabled: true

# Permit a network share (\\SERVER\Share) as the folder to protect. Leave this
# off. The service runs as LocalSystem and reaches a share as the machine
# account, so a folder that opened fine for the technician who set it up can
# still fail every hourly backup because the machine account was never granted
# access -- silently, with nothing in status.json to explain it. Only turn this
# on for a share whose permissions already include the machine account, and set
# it at install time with install.ps1 -AllowUNC so the installer and the agent
# agree.
#
# There is deliberately no equivalent switch for an optical or removable drive.
# Those are refused outright: an ejected disc is not a misconfiguration to be
# tolerated, it is a backup that quietly stops existing.
allow_unc: false

# Debug logging.
verbose: false

# ---------------------------------------------------------------------------
# Not configurable here, by design:
#
#   forget / prune  The gateway is append-only. The agent has no code path that
#                   deletes a snapshot, and a test asserts it, so a compromised
#                   or ransomware-hit PC cannot remove its own backups. Retention
#                   is a server-side decision made from a trusted machine.
#   retention       Likewise.
#   gateway URL per device  Fixed by this file's `server`. A device cannot be
#                   pointed at another server, which is what stops one tenant's
#                   agent writing into another's repository.
# ---------------------------------------------------------------------------
